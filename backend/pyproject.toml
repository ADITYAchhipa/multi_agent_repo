[project]
name = "promiseops-backend"
version = "0.1.0"
description = "Evidence and verification foundation for PromiseOps"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "falkordb==1.7.1",
  "cryptography==50.0.2",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0", "pip-audit==2.10.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires a real disposable FalkorDB server"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
